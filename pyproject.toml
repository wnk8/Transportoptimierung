[project]
name = "tk"
version = "0.1.0"
description = "Transportplanungs-Artefakt: Python-Port des Excel-Modells v11"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "latex2mathml>=3.81.1",
    "nicegui>=3.18.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# long German texts and LaTeX formulas
"src/tk/explain.py" = ["E501"]
"src/tk/checks.py" = ["E501"]
"src/tk/ui/*.py" = ["E501"]
"src/tk/agent/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tk.*"
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "nicegui.*", "pandas.*", "SALib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not e2e'"
markers = ["e2e: Browsertests mit Playwright (make e2e), nicht im schnellen Lauf"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
    "salib>=1.6.0",
    "syrupy>=6.1.1",
]
